<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>M1 Plus</title>
<script>try { const m = localStorage.getItem("wt-theme"); if (m === "light" || m === "dark") document.documentElement.dataset.theme = m; } catch { /* private mode: follow the system */ }</script>
<style>
:root {
  --bg: #f5f5f7; --panel: #fff; --text: #1d1d1f; --sub: #6e6e73; --line: #e3e3e6; --hover: #f0f0f2;
  --sel: #e6e6ea; --btn: #1d1d1f; --btn-text: #fff; --soft: #ececef; --danger: #d70015; --meter: #1d1d1f;
  --shadow: 0 8px 32px rgba(0,0,0,.14); --r: 12px;
  color-scheme: light dark;
}
/* dark: the system's when no theme is chosen (no data-theme), else the chosen one; the head script sets data-theme */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --bg: #000; --panel: #1c1c1e; --text: #f5f5f7; --sub: #98989d; --line: #2c2c2e; --hover: #242426;
    --sel: #303033; --btn: #f5f5f7; --btn-text: #000; --soft: #2c2c2e; --danger: #ff453a; --meter: #f5f5f7;
    --shadow: 0 8px 32px rgba(0,0,0,.6);
  }
}
:root[data-theme=light] { color-scheme: light; }
:root[data-theme=dark] {
  color-scheme: dark;
  --bg: #000; --panel: #1c1c1e; --text: #f5f5f7; --sub: #98989d; --line: #2c2c2e; --hover: #242426;
  --sel: #303033; --btn: #f5f5f7; --btn-text: #000; --soft: #2c2c2e; --danger: #ff453a; --meter: #f5f5f7;
  --shadow: 0 8px 32px rgba(0,0,0,.6);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans", "Noto Sans CJK SC", sans-serif;
  -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px 120px; }

/* header */
header { position: relative; display: flex; align-items: flex-end; gap: 16px; padding: 28px 0 18px; flex-wrap: wrap; }
.title h1 { margin: 0; font-size: 28px; letter-spacing: -.02em; }
.title p { margin: 2px 0 0; color: var(--sub); font-size: 13px; }
.hdctl { position: absolute; top: 12px; right: 0; display: flex; gap: 8px; }
.hdctl .btn, .hdctl select { height: 32px; }
.hdctl .btn.icon { width: 32px; }
.lang { position: relative; display: inline-flex; }
.lang svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; pointer-events: none; }
.lang select { border: 0; background: var(--soft); border-radius: 999px; padding: 0 12px 0 32px; outline: none; appearance: none; cursor: pointer; max-width: 150px; }
.lang option { color: var(--text); background: var(--panel); }
.storage { margin-left: auto; min-width: 220px; font-size: 12px; color: var(--sub); }
.meter { height: 6px; background: var(--soft); border-radius: 3px; overflow: hidden; margin-top: 6px; }
.meter > i { display: block; height: 100%; background: var(--meter); border-radius: 3px; }

/* toolbar */
.bar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 0; display: flex; gap: 8px;
  align-items: center; flex-wrap: wrap; }
.crumbs { display: flex; align-items: center; gap: 2px; font-size: 17px; font-weight: 600; min-width: 0; flex: 1 1 280px;
  overflow: hidden; white-space: nowrap; }
.crumbs a { color: var(--sub); text-decoration: none; padding: 4px 6px; border-radius: 8px; overflow: hidden; text-overflow: ellipsis; }
.crumbs a:hover { background: var(--hover); color: var(--text); }
.crumbs a.here { color: var(--text); }
.crumbs a.drop { background: var(--sel); color: var(--text); }
.crumbs .sep { color: var(--sub); opacity: .5; }
.btn { border: 0; border-radius: 999px; padding: 7px 14px; background: var(--soft); display: inline-flex; align-items: center; gap: 6px;
  white-space: nowrap; }
.btn:hover { filter: brightness(.96); }
.btn.primary { background: var(--btn); color: var(--btn-text); }
.btn.icon { padding: 0; justify-content: center; }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .4; cursor: default; filter: none; }
.btn svg { width: 16px; height: 16px; }
.tools .btn, .selbar .btn, .search input { height: 32px; }
.tools .btn.icon, .selbar .btn.icon { width: 32px; }
.search { position: relative; }
.search input { border: 0; background: var(--soft); border-radius: 999px; padding: 7px 12px 7px 32px; width: 180px; outline: none; }
.search input:focus { box-shadow: 0 0 0 2px var(--line); }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--sub); }
select.sort { border: 0; background: var(--soft); border-radius: 999px; padding: 7px 12px; outline: none; appearance: none; }

/* selection bar */
.bar { height: 56px; flex-wrap: nowrap; }
.selbar { display: none; flex: 1 1 280px; align-items: center; gap: 8px; height: 36px; }
.selbar b { margin-right: auto; font-size: 17px; font-weight: 600; padding: 4px 6px; }
.selecting .selbar { display: flex; }
.selecting .tools, .selecting .crumbs { display: none; }
.tools { display: flex; gap: 8px; align-items: center; justify-content: flex-end; height: 36px; }

/* list */
.card { background: var(--panel); border-radius: var(--r); overflow: hidden; }
.row { display: grid; grid-template-columns: 36px 40px minmax(0,1fr) 190px 90px 40px; align-items: center; min-height: 52px;
  padding: 0 6px; border-top: 1px solid var(--line); cursor: default; user-select: none; }
.row:first-child { border-top: 0; }
.row:hover { background: var(--hover); }
.row.sel { background: var(--sel); }
.row.drop { box-shadow: inset 0 0 0 2px var(--text); }
.row .name { min-width: 0; padding-right: 12px; }
.row .name span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .name small { display: none; color: var(--sub); font-size: 12px; }
.row .date, .row .size { color: var(--sub); font-size: 13px; text-align: right; padding-right: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.row.head { min-height: 34px; font-size: 12px; color: var(--sub); cursor: default; }
.row.head:hover { background: none; }
.row.head .name, .row.head .date, .row.head .size { cursor: pointer; }
.row.head .on { color: var(--text); }
.check { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--sub); display: grid; place-items: center;
  margin: 0 auto; opacity: .35; }
.row:hover .check, .selecting .check { opacity: 1; }
.row.sel .check { background: var(--text); border-color: var(--text); opacity: 1; }
.row.sel .check::after { content: ""; width: 9px; height: 5px; border: 2px solid var(--panel); border-top: 0; border-right: 0;
  transform: rotate(-45deg) translate(1px, -1px); }
.ico { width: 30px; height: 30px; border-radius: 6px; display: grid; place-items: center; color: var(--sub); overflow: hidden; }
.ico svg { width: 24px; height: 24px; }
.more { border: 0; background: none; width: 32px; height: 32px; border-radius: 50%; color: var(--sub); display: grid; place-items: center; }
.more:hover { background: var(--soft); color: var(--text); }
.chev { color: var(--sub); opacity: .6; }
.empty { padding: 60px 20px; text-align: center; color: var(--sub); }


/* menu */
.menu { position: fixed; z-index: 30; background: var(--panel); border-radius: 12px; box-shadow: var(--shadow); padding: 6px;
  min-width: 190px; border: 1px solid var(--line); }
.menu button { display: flex; width: 100%; border: 0; background: none; padding: 8px 10px; border-radius: 8px; gap: 10px; align-items: center; text-align: left; }
.menu button:hover { background: var(--hover); }
.menu button.danger { color: var(--danger); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 5px 4px; }
.menu svg { width: 16px; height: 16px; color: var(--sub); }
.menu .danger svg { color: var(--danger); }

/* dialog */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.35); display: grid; place-items: center; padding: 20px;
  animation: fade .15s; }
.dialog { background: var(--panel); border-radius: 16px; box-shadow: var(--shadow); width: min(400px, 100%); padding: 22px; }
.dialog h3 { margin: 0 0 6px; font-size: 17px; }
.dialog p { margin: 0 0 16px; color: var(--sub); font-size: 14px; word-break: break-word; }
.dialog input[type=text] { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 12px; outline: none; margin-bottom: 16px; }
.dialog .acts { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.dialog label { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--sub); margin: -4px 0 16px; }
.picker { max-height: 260px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 16px; }
.picker div { padding: 8px 12px; display: flex; gap: 8px; align-items: center; cursor: pointer; }
.picker div:hover { background: var(--hover); }
.picker div.on { background: var(--sel); font-weight: 600; }
.picker svg { width: 18px; height: 18px; color: var(--sub); flex: none; }
.picker .tog { width: 18px; height: 18px; display: grid; place-items: center; flex: none; border-radius: 4px; }
.picker .tog:hover { background: var(--soft); }
.picker .tog svg { width: 14px; height: 14px; transition: transform .1s; }
.picker .open svg { transform: rotate(90deg); }
.uploads li .btns { grid-row: 1 / 3; grid-column: 2; align-self: center; display: flex; }

/* uploads */
.uploads { position: fixed; right: 20px; bottom: 20px; z-index: 20; width: min(380px, calc(100% - 40px)); background: var(--panel);
  border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; border: 1px solid var(--line); }
.uploads .hd { display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer; }
.uploads .hd b { font-size: 14px; }
.uploads .hd small { color: var(--sub); font-size: 12px; display: block; }
.uploads .hd .grow { flex: 1; min-width: 0; }
.uploads .total { height: 3px; background: var(--soft); }
.uploads .total i { display: block; height: 100%; background: var(--meter); transition: width .2s; }
.uploads ul { list-style: none; margin: 0; padding: 4px 0; max-height: 260px; overflow: auto; border-top: 1px solid var(--line); }
.uploads.min ul { display: none; }
.uploads li { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 7px 14px; font-size: 13px; }
.uploads li .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.uploads li .st { color: var(--sub); font-size: 12px; grid-column: 1; }
.uploads li .x { border: 0; background: none; color: var(--sub); padding: 4px; border-radius: 50%; display: flex; }
.uploads li .x:hover { background: var(--soft); color: var(--text); }
.uploads li .x svg { width: 16px; height: 16px; }
.uploads li .p { grid-column: 1; height: 3px; background: var(--soft); border-radius: 2px; overflow: hidden; }
.uploads li .p i { display: block; height: 100%; background: var(--meter); }
.uploads li.done .st, .uploads li.done .n { color: var(--sub); }
.uploads li.err .st { color: var(--danger); }

/* drop overlay */
.dropzone { position: fixed; inset: 0; z-index: 35; display: none; place-items: center; background: rgba(0,0,0,.4); pointer-events: none; }
.dropzone div { border: 2px dashed #fff; border-radius: 20px; padding: 40px 56px; color: #fff; font-size: 20px; font-weight: 600; text-align: center; }
.dropzone small { display: block; font-size: 14px; font-weight: 400; opacity: .8; margin-top: 6px; }
body.dragging .dropzone { display: grid; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 50; background: var(--btn); color: var(--btn-text);
  padding: 10px 16px; border-radius: 999px; font-size: 14px; box-shadow: var(--shadow); display: flex; gap: 12px; align-items: center; animation: fade .2s; }
.toast button { border: 0; background: none; color: inherit; font-weight: 600; padding: 0; }
@keyframes fade { from { opacity: 0; } }

@media (max-width: 680px) {
  .wrap { padding: 0 12px 120px; }
  header { padding-top: 18px; }
  .storage { margin-left: 0; width: 100%; }
  .hdctl { top: 8px; }
  .lang select { width: 32px; padding: 0; color: transparent; }
  .row { grid-template-columns: 34px 40px minmax(0,1fr) 36px; }
  .row .date, .row .size { display: none; }
  .row .name small { display: block; }
  .search input { width: 120px; }
  .bar { height: auto; flex-wrap: wrap; }
  .tools, .selbar { flex: 1 1 100%; height: 36px; }
  .selecting .crumbs { display: flex; }  /* phone: only the tools row swaps */
  .tools .label, .selbar .label { display: none; }
}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <div class="title"><h1>M1 Plus</h1><p id="sub"></p></div>
    <div class="hdctl">
      <label class="lang"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.500 5.600 12 3z"/></svg><select id="langsel"></select></label>
      <button class="btn icon" id="theme"></button>
    </div>
    <div class="storage"><span id="space"></span><div class="meter"><i id="meter"></i></div></div>
  </header>
  <div class="bar" id="bar">
    <nav class="crumbs" id="crumbs"></nav>
    <div class="tools">
      <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="filter" type="search"></label>
      <button class="btn" id="newfolder"></button>
      <button class="btn primary" id="upload"></button>
    </div>
    <div class="selbar"><b id="selcount"></b>
      <button class="btn" data-act="download"></button>
      <button class="btn" data-act="move"></button>
      <button class="btn danger" data-act="delete"></button>
      <button class="btn icon" data-act="clear" title="Esc"></button>
    </div>
  </div>
  <main id="list"></main>
</div>
<input type="file" id="pickfiles" multiple hidden>
<input type="file" id="pickfolder" multiple webkitdirectory hidden>
<div class="dropzone"><div id="droptext"></div></div>
<div id="uploads"></div>

// ---------- API ----------
const API = "/cgi-bin/api.cgi", enc = encodeURIComponent;

// and Content-Type: application/octet-stream, which the server requires.
async function api(op, params = {}, post = false) {
  let r;
  try {
    r = post ? await fetch(`${API}?op=${op}`, { method: "POST", headers: { "Content-Type": "application/octet-stream" }, body: qs(params) })
      : await fetch(`${API}?op=${op}&${qs(params)}`);
  } catch { throw new Error(t("offline")); }
  let j = null;
  try { j = await r.json(); } catch { /* not JSON */ }
  if (!r.ok) throw Object.assign(new Error((j && j.error) || r.status + " " + r.statusText), { status: r.status });

// ---------- download ----------
// One file: a plain link (the answer carries Content-Disposition: attachment). Anything else: a tar of the selection,
// POSTed from a hidden form so the paths travel in the body.
function download(items) {
  if (!items.length) return;
  if (items.length === 1 && !items[0].dir) {
    const a = document.createElement("a");
    a.href = `${API}?op=download&path=${enc(full(items[0].name))}`; a.download = "";
    document.body.append(a); a.click(); a.remove();
    return;
  }
  let fr = $("#dlframe");
  if (!fr) {
    fr = document.createElement("iframe"); fr.id = fr.name = "dlframe"; fr.hidden = true;
    // a refusal arrives as a JSON page in the frame; a download does not load it
    fr.onload = () => { try { const j = JSON.parse(fr.contentDocument.body.textContent); if (j.error) toast(j.error); } catch { /* blank */ } };
    document.body.append(fr);
  }
  const f = document.createElement("form");
  f.method = "POST"; f.action = API + "?op=tar"; f.target = "dlframe"; f.hidden = true;
  const add = (k, v) => { const i = document.createElement("input"); i.type = "hidden"; i.name = k; i.value = v; f.append(i); };
  items.forEach(e => add("path", full(e.name)));
  if (items.length > 1 && path.length) add("name", path[path.length - 1]);
  document.body.append(f); f.submit(); f.remove();
}

// onDismiss runs when the dialog is dismissed (Escape, a click outside, a [data-close] button) rather than answered.
function dialog(html, wire, onDismiss) {

  s.innerHTML = `<div class="dialog">${html}</div>`;
  // Escape is heard on the document, since focus may still be on the page; only the topmost dialog takes it.
  const onKey = ev => { if (ev.key === "Escape" && s === [...document.querySelectorAll(".scrim")].pop()) dismiss(); };
  const close = () => { s.remove(); document.removeEventListener("keydown", onKey); };
  const dismiss = () => { if (!s.isConnected) return; close(); if (onDismiss) onDismiss(); };
  s.addEventListener("click", ev => { if (ev.target === s || ev.target.closest("[data-close]")) dismiss(); });
  document.addEventListener("keydown", onKey);

function ask(title, value, ph, ok, done) {

    (s, close) => {
      const inp = s.querySelector("input"); inp.focus();
      const dot = value.lastIndexOf("."); inp.setSelectionRange(0, dot > 0 ? dot : value.length);
      const go = () => {
        const v = inp.value.trim();
        if (!v || v.includes("/")) return;

    (s, close) => s.querySelector("[data-ok]").onclick = async () => {
      close();
      try { await api("delete", { path: items.map(e => full(e.name)) }, true); toast(t("deleted", { what: what(items) })); } catch (e) { fail(e); }
      sel.clear(); load(); refreshSpace();
    });
}
// The folder tree is loaded level by level: the root and the chain down to the current folder first, the rest on expanding.
function moveDialog(items) {
  if (!items.length) return;
  const moving = new Set(items.map(e => full(e.name)));
  const cwd = vpath(path), byKey = new Map();
  const mk = p => { const n = { p, kids: null, open: false, loading: false }; byKey.set(vpath(p), n); return n; };
  const top = mk([]); top.open = true;
  let target = path.slice();
  const collator = new Intl.Collator(tag, { numeric: true, sensitivity: "base" });
  let sc = null;
  async function fetchKids(n) {
    if (n.kids || n.loading) return;
    n.loading = true;
    try {
      const l = (await api("list", { path: vpath(n.p) })).entries.filter(e => e.dir && !moving.has(vpath([...n.p, e.name])));
      n.kids = l.sort((a, b) => collator.compare(a.name, b.name)).map(e => mk([...n.p, e.name]));
    } catch (e) { n.kids = []; fail(e); }
    n.loading = false;
    draw();
  }
  function flat(n, depth, out) {
    out.push([n, depth]);
    if (n.open && n.kids) n.kids.forEach(k => flat(k, depth + 1, out));
    return out;
  }
  function draw() {
    if (!sc || !sc.isConnected) return;
    const here = vpath(target);
    sc.querySelector(".picker").innerHTML = flat(top, 0, []).map(([n, d]) =>
      `<div data-k="${esc(vpath(n.p))}" class="${vpath(n.p) === here ? "on" : ""}" style="padding-left:${12 + d * 18}px">`
      + `<span class="tog ${n.open ? "open" : ""}" data-tog>${n.kids && !n.kids.length ? "" : I.chev}</span>${I.folder}${esc(n.p.length ? n.p[n.p.length - 1] : t("home"))}</div>`).join("");
    sc.querySelector("[data-ok]").disabled = here === cwd;
  }
  dialog(`<h3>${esc(t("moveTitle", { what: what(items) }))}</h3><div class="picker"></div><div class="acts"><button class="btn" data-close>${t("cancel")}</button><button class="btn primary" data-ok>${t("moveHere")}</button></div>`,
    (s, close) => {
      sc = s; draw();
      s.querySelector(".picker").onclick = ev => {
        const row = ev.target.closest("[data-k]"); if (!row) return;
        const n = byKey.get(row.dataset.k);
        if (ev.target.closest("[data-tog]")) { n.open = !n.open; draw(); if (n.open) fetchKids(n); }
        else { target = n.p; draw(); }
      };
      s.querySelector("[data-ok]").onclick = () => { close(); moveTo(items, target); };
      (async () => {
        let n = top;
        await fetchKids(n);
        for (const name of path) {
          const k = n.kids && n.kids.find(x => x.p[x.p.length - 1] === name);
          if (!k) break;
          k.open = true; n = k; await fetchKids(n);
        }
        draw();
      })();
    });
}
async function moveTo(items, target) {
  if (vpath(target) === vpath(path)) return;
  try {
    await api("move", { to: vpath(target), conflict: "fail", path: items.map(e => full(e.name)) }, true);
    toast(t("moved", { what: what(items) }));
  } catch (e) { fail(e); }
  sel.clear(); load();
}
let toastTimer;
function toast(msg) {
  document.querySelector(".toast")?.remove(); clearTimeout(toastTimer);
  const d = document.createElement("div"); d.className = "toast"; d.textContent = msg; document.body.appendChild(d);
  toastTimer = setTimeout(() => d.remove(), 4000);
}

// ---------- drag rows onto folders / crumbs ----------
let dragNames = null;
$("#list").addEventListener("dragstart", ev => {
  const it = itemOf(ev.target); if (!it) return;
  if (!sel.has(it.dataset.name)) { sel.clear(); sel.add(it.dataset.name); }
  dragNames = [...sel]; ev.dataTransfer.setData("text/x-move", "1"); ev.dataTransfer.effectAllowed = "move";
});
$("#list").addEventListener("dragend", () => { dragNames = null; render(); });
function moveTarget(ev) {
  const e = entryOf(ev.target), cr = ev.target.closest("#crumbs a");
  if (e) return e.dir && !dragNames.includes(e.name) ? { el: itemOf(ev.target), p: [...path, e.name] } : null;
  if (cr && !cr.classList.contains("here")) return { el: cr, p: path.slice(0, +cr.dataset.depth) };
  return null;
}
document.addEventListener("dragover", ev => {
  document.querySelectorAll(".drop").forEach(x => x.classList.remove("drop"));
  if (dragNames) { const m = moveTarget(ev); if (m) { ev.preventDefault(); m.el.classList.add("drop"); } return; }
  if ([...ev.dataTransfer.types].includes("Files")) { ev.preventDefault(); document.body.classList.add("dragging"); }
});
document.addEventListener("dragleave", ev => { if (!ev.relatedTarget) document.body.classList.remove("dragging"); });
document.addEventListener("drop", async ev => {
  ev.preventDefault(); document.body.classList.remove("dragging");
  if (dragNames) { const m = moveTarget(ev); if (m) moveTo(entries.filter(k => dragNames.includes(k.name)), m.p); dragNames = null; return; }
  const files = [];
  const walk = (entry, rel) => new Promise(res => {
    if (entry.isFile) entry.file(f => { files.push({ f, rel }); res(); }, res);
    else { const r = entry.createReader(), all = [];
      const read = () => r.readEntries(async es => { if (es.length) { all.push(...es); read(); }
        else { for (const e of all) await walk(e, rel + entry.name + "/"); res(); } }, res); read(); }
  });
  const ents = [...ev.dataTransfer.items].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  const plain = [...ev.dataTransfer.files];
  if (ents.length) for (const e of ents) await walk(e, ""); else plain.forEach(f => files.push({ f, rel: "" }));
  enqueue(files);
});
document.addEventListener("dragenter", () => { $("#droptext").innerHTML = `${esc(t("drop", { dir: "“" + [t("home"), ...path].pop() + "”" }))}<small>${t("dropSub")}</small>`; });
$("#pickfiles").onchange = ev => { enqueue([...ev.target.files].map(f => ({ f, rel: "" }))); ev.target.value = ""; };
$("#pickfolder").onchange = ev => { enqueue([...ev.target.files].map(f => ({ f, rel: f.webkitRelativePath.replace(/[^/]*$/, "") }))); ev.target.value = ""; };

// ---------- upload queue (one file at a time) ----------
// A file below 2 GiB is one request; from 2 GiB (thttpd's body limit is 2 GiB - 1) it goes in 1 GiB chunks
// (offset=, last=1). Cancel aborts the request; the server deletes the half-written .part.
const LIMIT = 2 ** 31, CHUNK = 2 ** 30;
const Q = []; let running = false, minimized = false, applyAll = null, made = new Set(), meas = { bytes: 0, ms: 0 }, lastRefresh = 0, refT = 0, drawT = 0;
const active = q => q.state === "wait" || q.state === "up";

async function enqueue(list) {
  // dot files (.DS_Store, ._x) and anything below a dot folder: the server refuses hidden names
  list = list.filter(x => !x.f.name.startsWith(".") && !x.rel.split("/").some(s => s.startsWith(".")));
  if (!list.length) return;
  let free;
  try { free = (await api("df")).free; } catch (e) { return fail(e); }
  if (list.reduce((s, x) => s + x.f.size, 0) > free) return toast(t("noSpace"));
  if (!Q.some(active)) { Q.length = 0; meas = { bytes: 0, ms: 0 }; }
  for (const x of list) {
    const q = { f: x.f, name: x.f.name, size: x.f.size, rel: x.rel, dir: path.slice(), sent: 0, state: "wait", msg: "" };
    if ([q.name, ...x.rel.split("/").filter(Boolean)].some(badName)) { q.state = "err"; q.msg = t("badName"); q.bad = true; }
    Q.push(q);
  }
  paintQueue(); pump();
}
const ensureDirs = async (parts, base) => {
  for (let i = base; i < parts.length; i++) {
    const key = vpath(parts.slice(0, i + 1));
    if (made.has(key)) continue;
    try { await api("mkdir", { path: vpath(parts.slice(0, i)), name: parts[i] }, true); } catch (e) { if (e.status !== 409) throw e; }
    made.add(key);
  }
};
function conflict(q, parts) {
  if (applyAll) return Promise.resolve(applyAll);
  return new Promise(res => dialog(`<h3>${esc(t("exists", { name: q.name }))}</h3><p>${esc(t("existsBody", { dir: vpath(parts) }))}</p>
    <label><input type="checkbox"> ${t("applyAll")}</label>
    <div class="acts"><button class="btn" data-c="skip">${t("skip")}</button><button class="btn" data-c="keep">${t("keepBoth")}</button><button class="btn primary" data-c="replace">${t("replace")}</button></div>`,
    (s, close) => s.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { close(); if (s.querySelector("input").checked) applyAll = b.dataset.c; res(b.dataset.c); }),
    () => res("skip")));
}
function send(q, p, blob, base) {
  return new Promise(res => {
    const x = new XMLHttpRequest(); q.xhr = x;
    x.open("POST", `${API}?op=upload&${qs(p)}`);
    x.setRequestHeader("Content-Type", "application/octet-stream");
    let lt = performance.now(), ll = 0;
    x.upload.onprogress = ev => {
      const now = performance.now(); meas.ms += now - lt; meas.bytes += ev.loaded - ll; lt = now; ll = ev.loaded;
      q.sent = base + ev.loaded; paintQueue(true);
    };
    x.onload = () => {
      let j = {}; try { j = JSON.parse(x.responseText); } catch { /* no JSON */ }
      res({ status: x.status, error: j.error || x.status + " " + x.statusText });
    };
    x.onerror = () => res({ status: 0, error: t("offline") });
    x.onabort = () => res({ status: 0, error: "" });
    x.send(blob);
  });
}
async function transfer(q, parts, mode) {
  const chunked = q.size >= LIMIT;
  let off = 0, r;
  q.sent = 0;
  do {
    if (q.state !== "up") return { status: 0, error: "" };  // cancelled while waiting for a folder or between chunks
    const end = chunked ? Math.min(off + CHUNK, q.size) : q.size;
    const p = { path: vpath(parts), name: q.name, conflict: mode };
    if (chunked) { p.offset = off; if (end >= q.size) p.last = 1; }
    r = await send(q, p, chunked ? q.f.slice(off, end) : q.f, off);
    r.first = off === 0;
    if (r.status !== 200) return r;
    off = end;
  } while (off < q.size);
  return r;
}
async function upload(q) {
  const parts = [...q.dir, ...q.rel.split("/").filter(Boolean)];
  await ensureDirs(parts, q.dir.length);
  let mode = "fail";
  for (;;) {
    const r = await transfer(q, parts, mode);
    if (q.state !== "up") return;  // cancelled
    if (r.status === 200) { q.state = "done"; q.sent = q.size; return; }
    if (r.status === 409 && mode === "fail" && r.first) {
      const c = await conflict(q, parts);
      if (c === "skip") { q.state = "cancel"; return; }
      mode = c; continue;
    }
    throw new Error(r.error);
  }
}
async function pump() {
  if (running) return; running = true;
  let q;
  while ((q = Q.find(x => x.state === "wait"))) {
    q.state = "up"; q.sent = 0; q.msg = ""; paintQueue();
    try { await upload(q); } catch (e) { if (q.state === "up") { q.state = "err"; q.msg = e.message; } }
    paintQueue();
    if (q.state === "done") scheduleRefresh();
  }
  running = false; applyAll = null; made.clear(); paintQueue(); scheduleRefresh(true);
}
function scheduleRefresh(last) {
  clearTimeout(refT);
  refT = setTimeout(() => { lastRefresh = performance.now(); load(); refreshSpace(); }, last ? 0 : Math.max(0, 5000 - (performance.now() - lastRefresh)));
}
window.addEventListener("beforeunload", ev => { if (Q.some(active)) { ev.preventDefault(); ev.returnValue = ""; } });

function paintQueue(soft) {
  if (soft) { if (!drawT) drawT = setTimeout(() => { drawT = 0; paintQueue(); }, 250); return; }
  clearTimeout(drawT); drawT = 0;
  const box = $("#uploads");
  if (!Q.length) { box.innerHTML = ""; return; }
  const live = Q.filter(q => q.state !== "cancel"), total = live.reduce((s, q) => s + q.size, 0), sent = live.reduce((s, q) => s + q.sent, 0);
  const left = Q.filter(active).length, done = Q.filter(q => q.state === "done").length;
  const rate = meas.ms > 500 ? meas.bytes / meas.ms * 1000 : 0, secs = rate ? Math.ceil((total - sent) / rate) : 0;
  const eta = !rate ? "…" : secs < 60 ? t("sec", { n: secs }) : t("min", { n: Math.ceil(secs / 60) });
  const head = left ? t("uploading", { n: left }) : t("uploaded", { n: done });
  const subl = left ? t("left", { size: fmtSize(total - sent), t: eta }) : t("rescan");
  const idx = Q.map((q, i) => i);
  const shown = Q.length <= 60 ? idx : [...idx.filter(i => Q[i].state === "up" || Q[i].state === "err"), ...idx.filter(i => Q[i].state === "wait")].slice(0, 60);
  box.innerHTML = `<div class="uploads ${minimized ? "min" : ""}"><div class="hd" data-min><div class="grow"><b>${esc(head)}</b><small>${esc(subl)}</small></div>
    <button class="more" data-closeq title="${t("cancel")}">${left ? I.chevDown : I.x}</button></div>
    <div class="total"><i style="width:${total ? (sent / total * 100).toFixed(1) : 0}%"></i></div>
    <ul>${shown.map(i => { const q = Q[i]; return `<li class="${q.state}"><span class="n">${esc(q.rel + q.name)}</span>
      <span class="btns">${q.state === "err" && !q.bad ? `<button class="x" data-r="${i}">${I.up}</button>` : ""}${q.state === "done" ? "" : `<button class="x" data-x="${i}">${I.x}</button>`}</span>
      ${q.state === "up" ? `<span class="p"><i style="width:${q.size ? (q.sent / q.size * 100).toFixed(1) : 0}%"></i></span>` : `<span class="st">${esc(
        { wait: t("waiting"), done: fmtSize(q.size) + " · " + t("done"), err: q.msg || t("failed"), cancel: t("cancelled") }[q.state])}</span>`}</li>`; }).join("")}</ul></div>`;
}
$("#uploads").addEventListener("click", ev => {
  const x = ev.target.closest("[data-x]"), r = ev.target.closest("[data-r]");
  if (r) { const q = Q[r.dataset.r]; q.state = "wait"; q.sent = 0; q.msg = ""; paintQueue(); pump(); return; }
  if (x) {
    const q = Q[x.dataset.x];
    if (q.state === "up") { q.state = "cancel"; q.xhr?.abort(); } else q.state = "cancel";
    return paintQueue();
  }
  if (ev.target.closest("[data-closeq]")) { if (!Q.some(active)) { Q.length = 0; minimized = false; } else minimized = !minimized; return paintQueue(); }
  if (ev.target.closest("[data-min]")) { minimized = !minimized; paintQueue(); }
});

labels();
refreshSpace();
window.dispatchEvent(new HashChangeEvent("hashchange"));
</script>
